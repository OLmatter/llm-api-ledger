homepage: https://cursor.com
docs: https://cursor.com/docs
last_verified: 2026-08-04

affiliate: null

shared_features:
  primary_model: grok-4.5
  models:
    - grok-4.5
    - grok-4.5-fast
    - composer-2.5
    - composer-2.5-fast
    - third-party-frontier-models
  models_note: |
    Cursor Pro uses two independent monthly pools:
    - Cursor Models: Grok 4.5 and Composer 2.5, including Fast variants.
    - Other Models: third-party models charged against the pool at API-equivalent rates.
    The official page does not publish an exact dollar cap for the Cursor Models pool.
  clients:
    - Cursor Editor
    - Cursor CLI
  rate_limit_tiers: [monthly]
  rate_limit_note: |
    Both usage pools reset with the monthly billing cycle. The dashboard reports token totals and
    spend-equivalent usage, but included CSV rows replace per-request dollar cost with "Included".
  api:
    upstream: null

