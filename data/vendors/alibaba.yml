  - 唯一当前在售档位：Pro ¥200/月

# 厂商公共特性
shared_features:
  # 主力模型（榜单对比基准）
  # 注意：官方帮助文档（2026-07-16）推荐列首位 = qwen3.7-plus
  #       但控制台购买页（2026-08-04 实测）推荐列首位 = qwen3.5-plus
  #       当前写 yml 用控制台实测（用户实际下单界面）
  primary_model: qwen3.5-plus
  models:
    # 推荐列（5 个，控制台实测）
    - qwen3.5-plus
    - qwen3-coder-next
    - glm-5
    - kimi-k2.5
    - MiniMax-M2.5
    # 更多模型列（控制台实测 2 个）
    - qwen3-coder-plus
    - glm-4.7
  models_note: |
    控制台实测 7 个模型白名单。官方帮助文档还有 qwen3.6-plus / qwen3-max-2026-01-23 等，
    但控制台当前未列出 → yml 只列控制台展示的 7 个，避免"宣传有但买不到"。
  clients:
    - OpenClaw
    - Claude Code
    - Qwen Code
    - Cline
    - Cursor
    - OpenCode
    - Codex
    - Hermes Agent
    - Qoder
    - Cherry Studio
    - Chatbox
  clients_note: |
    Coding Plan 仅限交互式编程工具使用，严禁 API 调用（自动化脚本/批量调用违规封号）。
  rate_limit_tiers: [5h, weekly, monthly]
  rate_limit_note: |
    三窗口独立额度：5h 滚动恢复 / 周一 00:00 UTC+8 重置 / 订阅日次月对应日 00:00 UTC+8 重置。
    月度 = 周度 × 2（整数倍硬封顶，与火山方舟同型）。

