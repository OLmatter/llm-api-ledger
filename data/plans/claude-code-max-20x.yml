# Claude Code Max 20× Plan
# Claude Code 高档 = Pro × 20(anthropic.com/pricing FAQ 官方倍率)
# 2026-07-31 更新:
#   - 5h tokens: Pro 39.66M × 20 = 793.2M (anthropic.com/pricing FAQ "20× more usage per 5-hour session than Pro")
#   - weekly/monthly: Anthropic 官方不公布且 FAQ 明示「weekly/monthly caps at our discretion」,
#     无独立实测数据,留 null (铁律 18「没数据不填」)
#   - cost_limit_usd: $280 (Maciek plans.py local_estimate,标 disputed)
#   - per-model 拆分: 按 20× Pro per-model 反推,标 medium credibility
#   - 注:Maciek cost_limit 20× = $280 (7.78× Pro $36) 与 20× token multiplier 不一致,
#     5h tokens 以 anthropic 官方 20× 为准

plan_id: claude-code-max-20x
vendor: anthropic
plan_name: Claude Code Max 20x
plan_tier: max-20x
status: active
last_verified: 2026-07-31

# Claude Code 倍率:Max 20× = Pro × 20
codex_multiplier: 20

reset_card_available: true
reset_card_note: |
  Anthropic 提供 usage credits(额外用量):撞 limit 后按标准 API 价继续跑。
  开启后实际用量可超过下方 tokens_measured 基础 cap,直到月度账单封顶。

pricing:
  currency: USD
  original_monthly: 200
  yearly_total: null
  yearly_monthly_equivalent: null
  yearly_note: Anthropic Max 系列仅月付,无年付折扣
  auto_renew_default: true

# 限额：5h 用官方 20× multiplier(anthropic.com/pricing FAQ),周/月留 null
limits:
  window_5h:
    requests_official: null
    tokens_measured: 793200000       # 793.2M(Pro 39.66M × 20,anthropic 官方倍率)
    tokens_official_claimed: null
    cost_limit_usd: 280.00           # Maciek plans.py local_estimate(原 $140,5-6 翻倍后 $280)
    cost_limit_disputed: true        # 标 disputed:Maciek 源码 confidence=local_estimate
    cost_limit_credibility: medium
    note: |
      793.2M tokens = Pro 39.66M × 20(anthropic.com/pricing FAQ 官方倍率)。
      Maciek plans.py cost_limit $140 翻倍后 $280(标 disputed)。
      注:20× token multiplier (793.2M) 与 cost_limit 20× ($280,仅 7.78× Pro $36) 不一致,
      以 anthropic 官方 20×/5-hour session 为准。
      注:标准情况,开启 usage credits 可绕过此 cap。
  window_weekly:
    requests_official: null
    tokens_measured: null             # 无独立实测,Anthropic FAQ 明示 weekly caps 由其酌定
    tokens_official_claimed: null
    cost_limit_usd: null
    note: |
      Anthropic 官方不公开周 cap 数字,且 anthropic.com/pricing FAQ 明示:
      「we may limit your usage in other ways, such as weekly and monthly caps
      or model and feature usage, at our discretion」。
      无独立实测数据,留 null (铁律 18)。
  window_monthly:
    requests_official: null
    tokens_official_claimed: null
    tokens_measured: null             # 无独立实测
    cost_limit_usd: null
    note: |
      Anthropic 官方不公布月 cap,FAQ 明示 monthly caps at our discretion。
      无独立实测数据,留 null (铁律 18)。

ratio_note: |
  Max 20× ($200/月) = Pro × 20(anthropic 官方倍率)。
  ⚠️ 以下 5h 数字是**标准情况**(未开启 usage credits),开启后实际用量可超过此 cap。

  ## 5h:793.2M (官方 20×)
  anthropic.com/pricing FAQ 原文:
  「Max gives you 5x or 20x more usage per 5-hour session than Pro.」
  Pro 5h 实测 39.66M × 20 = **793.2M tokens/5h** (high credibility)。

  ## 周/月:null (无独立数据)
  Anthropic 不公开周/月具体数字,且 FAQ 明示「at our discretion」不保证按 20× 缩放。
  用户实测:Max 20× 一天可消耗 43% 周配额(逆向工程揭露 7 个叠加 Bug,segmentfault 文章),
  说明周限真实存在但具体数字不公布。
  等独立实测后再补。

  ## 主力模型(同 Pro 订阅范围,Fable 5 占周限 50%)
  Opus 5 / Sonnet 5 / Fable 5(占周限 50%) / Opus 4.x / Sonnet 4.6 / Haiku 4.5。
  适合大规模项目批量分析、多并行 Claude Code Agent、长跑 Agent。

  ## cost_limit 不一致说明
  Maciek plans.py cost_limit Max 20× = $140(翻倍后 $280),仅 7.78× Pro $36。
  若按 cost_limit 反推 5h tokens 仅 308M,与 anthropic 官方 20× 不一致。
  本 yml 以 anthropic 官方 20× 倍率为准(权威),cost_limit 标 disputed 仅供参考。

measurements:
  # ── 1. 官方倍率依据 ──
  - measurement_id: m_2026_07_max_20x_5h_official_20x
    source_kind: anthropic_official
    period: 2026-Q3
    window_5h_tokens: 793200000
    inference_method: |
      anthropic.com/pricing FAQ 原文:
      「Max gives you 5x or 20x more usage per 5-hour session than Pro.」
      Pro 5h 实测 39.66M (awesome-coding-plan) × 20 = 793.2M tokens/5h
    credibility: medium
    disputed: false
    dispute_note: |
      multiplier 是 anthropic 官方,但 Pro 39.66M baseline 是 community_consensus(medium-high),
      整体推导 = medium credibility(铁律 10)。
    notes: |
      anthropic.com/pricing FAQ 官方表述,5h session 倍率 20× Pro。
      周/月 Anthropic 不保证 20× 缩放(FAQ 明示 at our discretion),本 yml 留 null。

  # ── 2. Maciek cost_limit (community local_estimate,标 disputed) ──
  - measurement_id: m_2026_07_maciek_cost_limit_max_20x
    source_kind: community_local_estimate
    period: 2026-07
    cost_limit_5h_usd: 280.00
    credibility: medium
    disputed: true
    dispute_note: |
      Maciek plans.py 源码 PLAN_LIMITS Max 20× = $140(5-6 翻倍后 $280)。
      源码 PlanConfig dataclass confidence: str = "local_estimate"(本地估算,非官方)。
      与 anthropic 官方 20× token multiplier 不一致(仅 7.78×),仅作参考。
    notes: |
      Maciek 监控工具 PLAN_LIMITS 硬编码,8.5k star 但源码标 local_estimate。
      不应作为权威 cap 数据。

  # ── 3. Pro 实测基线 cross-reference ──
  - measurement_id: m_2026_07_awesome_coding_plan_pro_baseline
    source_kind: community_consensus
    period: 2026-Q2
    window_5h_tokens: 39660000
    credibility: medium
    notes: |
      Pro 5h 实测 39.66M (awesome-coding-plan 主表 Claude Pro 行)。
      Max 20× 5h = Pro × 20 = 793.2M,基于此 baseline 反推。
      注:在 Max 上下文中作为推导基线,credibility 标 medium(避免与 plan disputed 矛盾)。

  # ── 4. 第三方观察:Max 20× 周限真实存在 ──
  - measurement_id: m_2026_07_max_20x_weekly_exists
    source_kind: community_report
    period: 2026-Q2
    weekly_quota_consumed_in_one_day_percent: 43
    credibility: medium
    disputed: false
    notes: |
      segmentfault 文章:逆向工程揭露 7 个叠加 Bug 导致 Max 20× 用户
      一天消耗 43% 周配额。说明周限真实存在但具体数字 Anthropic 不公布。
      本 yml weekly tokens_measured 留 null(铁律 18)。

  # ── 5. Per-model 拆分(20× Pro per-model 反推) ──
  # 公式:Pro per-model window_5h_tokens × 20 = Max 20× per-model window_5h_tokens

  - measurement_id: m_2026_07_max_20x_model_opus_5
    source_kind: per_model_breakdown
    model_id: claude-opus-5
    window_5h_tokens: 720000000
    cost_per_million: 1.0000
    input_per_million: 5.00
    cached_per_million: 0.50
    output_per_million: 25.00
    credibility: medium
    notes: |
      Opus 5 ($5/$0.50/$25):Pro 36M × 20 = **720M tokens/5h**。
      注:cost_limit $280 反推仅 280M,20× token 反推 720M,以官方 20× 为准。

