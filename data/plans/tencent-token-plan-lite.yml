ratio_note: |
  ## 自洽性验算（铁律 22）
  39 元 ÷ 35M tokens = 1.114 元/百万 ≈ 官方公布 1.11 ✓（0.4% 误差）

  ## Token Plan vs Coding Plan
  - Token Plan 按 token 数扣费（不限模型）
  - Coding Plan 按"模型调用次数"扣费
  - 不能互替也不能同档叠加

