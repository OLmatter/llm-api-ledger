# Claude Code Max 5× Plan
# Claude Code 中档 = Pro × 5（anthropic.com/pricing FAQ 官方倍率）
# 2026-07-31 更新:
#   - 5h tokens: Pro 39.66M × 5 = 198.3M (anthropic.com/pricing FAQ "5× more usage per 5-hour session than Pro")
#   - weekly/monthly: Anthropic 官方不公布且 FAQ 明示「weekly/monthly caps at our discretion」,
#     无独立实测数据,留 null (铁律 18「没数据不填」)
#   - cost_limit_usd: $70 (Maciek plans.py local_estimate,标 disputed)
#   - per-model 拆分: 按 5× Pro per-model 反推,标 medium credibility
#   - 注:Maciek cost_limit 5× = $70 (1.94× Pro $36) 与 5× token multiplier 不一致,
#     5h tokens 以 anthropic 官方 5× 为准

plan_id: claude-code-max-5x
vendor: anthropic
plan_name: Claude Code Max 5x
plan_tier: max-5x
status: active
last_verified: 2026-07-31

# Claude Code 倍率:Max 5× = Pro × 5
codex_multiplier: 5

reset_card_available: true
reset_card_note: |
  Anthropic 提供 usage credits(额外用量):撞 limit 后按标准 API 价继续跑。
  开启后实际用量可超过下方 tokens_measured 基础 cap,直到月度账单封顶。

pricing:
  currency: USD
  original_monthly: 100
  yearly_total: null
  yearly_monthly_equivalent: null
  yearly_note: Anthropic Max 系列仅月付,无年付折扣
  auto_renew_default: true

# 限额：5h 用官方 5× multiplier（anthropic.com/pricing FAQ）,周/月留 null
limits:
  window_5h:
    requests_official: null
    tokens_measured: 198300000       # 198.3M(Pro 39.66M × 5,anthropic 官方倍率)
    tokens_official_claimed: null
    cost_limit_usd: 70.00            # Maciek plans.py local_estimate(原 $35,5-6 翻倍后 $70)
    cost_limit_disputed: true        # 标 disputed:Maciek 源码 confidence=local_estimate
    cost_limit_credibility: medium
    note: |
      198.3M tokens = Pro 39.66M × 5(anthropic.com/pricing FAQ 官方倍率)。
      Maciek plans.py cost_limit $35 翻倍后 $70(标 disputed)。
      注:5× token multiplier (198.3M) 与 cost_limit 5× ($70,仅 1.94× Pro $36) 不一致,
      以 anthropic 官方 5×/5-hour session 为准。
      注:标准情况,开启 usage credits 可绕过此 cap。
  window_weekly:
    requests_official: null
    tokens_measured: null             # 无独立实测,Anthropic FAQ 明示 weekly caps 由其酌定
    tokens_official_claimed: null
    cost_limit_usd: null              # 无数据
    note: |
      Anthropic 官方不公开周 cap 数字,且 anthropic.com/pricing FAQ 明示:
      「we may limit your usage in other ways, such as weekly and monthly caps
      or model and feature usage, at our discretion」。
      无独立实测数据,留 null (铁律 18「没数据不填」)。
  window_monthly:
    requests_official: null
    tokens_official_claimed: null
    tokens_measured: null             # 无独立实测
    cost_limit_usd: null
    note: |
      Anthropic 官方不公布月 cap,FAQ 明示 monthly caps at our discretion。
      无独立实测数据,留 null (铁律 18)。

ratio_note: |
  Max 5× ($100/月) = Pro × 5(anthropic 官方倍率)。
  ⚠️ 以下 5h 数字是**标准情况**(未开启 usage credits),开启后实际用量可超过此 cap。

  ## 5h:198.3M (官方 5×)
  anthropic.com/pricing FAQ 原文:
  「Max gives you 5x or 20x more usage per 5-hour session than Pro.」
  Pro 5h 实测 39.66M × 5 = **198.3M tokens/5h** (high credibility)。

  ## 周/月:null (无独立数据)
  Anthropic 不公开周/月具体数字,且 FAQ 明示「at our discretion」不保证按 5× 缩放。
  等独立实测后再补。

  ## 主力模型(同 Pro 订阅范围)
  Opus 5(Max 默认) / Sonnet 5 / Fable 5(占周限 50%) / Opus 4.x / Sonnet 4.6 / Haiku 4.5。
  Fable 5 在 Max 5× 可占**周限 50%**(anthropic.com/pricing plan compare 表)。

  ## cost_limit 不一致说明
  Maciek plans.py cost_limit Max 5× = $35(翻倍后 $70),仅 1.94× Pro $36。
  若按 cost_limit 反推 5h tokens 仅 77M,与 anthropic 官方 5× 不一致。
  本 yml 以 anthropic 官方 5× 倍率为准(权威),cost_limit 标 disputed 仅供参考。

measurements:
  # ── 1. 官方倍率依据 ──
  - measurement_id: m_2026_07_max_5x_5h_official_5x
    source_kind: anthropic_official
    period: 2026-Q3
    window_5h_tokens: 198300000
    inference_method: |
      anthropic.com/pricing FAQ 原文:
      「Max gives you 5x or 20x more usage per 5-hour session than Pro.」
      Pro 5h 实测 39.66M (awesome-coding-plan) × 5 = 198.3M tokens/5h
    credibility: medium
    disputed: false
    dispute_note: |
      multiplier 是 anthropic 官方,但 Pro 39.66M baseline 是 community_consensus(medium-high),
      整体推导 = medium credibility(铁律 10)。
    notes: |
      anthropic.com/pricing FAQ 官方表述,5h session 倍率 5× Pro。
      周/月 Anthropic 不保证 5× 缩放(FAQ 明示 at our discretion),本 yml 留 null。

  # ── 2. Maciek cost_limit (community local_estimate,标 disputed) ──
  - measurement_id: m_2026_07_maciek_cost_limit_max_5x
    source_kind: community_local_estimate
    period: 2026-07
    cost_limit_5h_usd: 70.00
    credibility: medium
    disputed: true
    dispute_note: |
      Maciek plans.py 源码 PLAN_LIMITS Max 5× = $35(5-6 翻倍后 $70)。
      源码 PlanConfig dataclass confidence: str = "local_estimate"(本地估算,非官方)。
      与 anthropic 官方 5× token multiplier 不一致(仅 1.94×),仅作参考。
    notes: |
      Maciek 监控工具 PLAN_LIMITS 硬编码,8.5k star 但源码标 local_estimate。
      不应作为权威 cap 数据。

  # ── 3. Pro 实测基线 cross-reference ──
  - measurement_id: m_2026_07_awesome_coding_plan_pro_baseline
    source_kind: community_consensus
    period: 2026-Q2
    window_5h_tokens: 39660000
    credibility: medium
    notes: |
      Pro 5h 实测 39.66M (awesome-coding-plan 主表 Claude Pro 行)。
      Max 5× 5h = Pro × 5 = 198.3M,基于此 baseline 反推。
      注:在 Max 上下文中作为推导基线,credibility 标 medium(避免与 plan disputed 矛盾)。

  # ── 4. Per-model 拆分(5× Pro per-model 反推) ──
  # 公式:Pro per-model window_5h_tokens × 5 = Max 5× per-model window_5h_tokens
  # cost_per_million 沿用 Pro 拆分(基于 Anthropic 官方定价,不变)

  - measurement_id: m_2026_07_max_5x_model_opus_5
    source_kind: per_model_breakdown
    model_id: claude-opus-5
    window_5h_tokens: 180000000
    cost_per_million: 1.0000
    input_per_million: 5.00
    cached_per_million: 0.50
    output_per_million: 25.00
    credibility: medium
    notes: |
      Opus 5 ($5/$0.50/$25):Pro 36M × 5 = **180M tokens/5h**。
      注:cost_limit $70 反推仅 70M,5× token 反推 180M,以官方 5× 为准。

  - measurement_id: m_2026_07_max_5x_model_opus_4_8
    source_kind: per_model_breakdown
    model_id: claude-opus-4-8
    window_5h_tokens: 180000000
    cost_per_million: 1.0000
    input_per_million: 5.00
    cached_per_million: 0.50
    output_per_million: 25.00
    credibility: medium
    notes: |
      Opus 4.8 ($5/$0.50/$25):Pro 36M × 5 = **180M tokens/5h**。
      Opus 5 公告明示「priced at the same as Opus 4.8」。

  - measurement_id: m_2026_07_max_5x_model_opus_4_5
    source_kind: per_model_breakdown
    model_id: claude-opus-4-5
    window_5h_tokens: 180000000
    cost_per_million: 1.0000
    input_per_million: 5.00
    cached_per_million: 0.50
    output_per_million: 25.00
    credibility: medium
    notes: |
      Opus 4.5 ($5/$0.50/$25,legacy):Pro 36M × 5 = **180M tokens/5h**。

  - measurement_id: m_2026_07_max_5x_model_opus_4_1
    source_kind: per_model_breakdown
    model_id: claude-opus-4-1
    window_5h_tokens: 60000000
    cost_per_million: 3.0000
    input_per_million: 15.00
    cached_per_million: 1.50
    output_per_million: 75.00
    credibility: medium
    notes: |
      Opus 4.1 ($15/$1.50/$75,legacy):Pro 12M × 5 = **60M tokens/5h**。

  - measurement_id: m_2026_07_max_5x_model_sonnet_5
    source_kind: per_model_breakdown
    model_id: claude-sonnet-5
    window_5h_tokens: 300000000
    cost_per_million: 0.6000
    input_per_million: 3.00
    cached_per_million: 0.30
    output_per_million: 15.00
    credibility: medium
    notes: |
      Sonnet 5 ($3/$0.30/$15 标准价):Pro 60M × 5 = **300M tokens/5h**。
      限时 $2/$10 到 8-31 期间 effective $/M = 0.40 → 450M/5h(更划算,过期失效)。
      本字段用标准价(铁律 17 双层定价)。

  - measurement_id: m_2026_07_max_5x_model_sonnet_4_6
    source_kind: per_model_breakdown
    model_id: claude-sonnet-4-6
    window_5h_tokens: 300000000
    cost_per_million: 0.6000
    input_per_million: 3.00
    cached_per_million: 0.30
    output_per_million: 15.00
    credibility: medium
    notes: |
      Sonnet 4.6 ($3/$0.30/$15):Pro 60M × 5 = **300M tokens/5h**。

  - measurement_id: m_2026_07_max_5x_model_sonnet_4_5
    source_kind: per_model_breakdown
    model_id: claude-sonnet-4-5
