  - measurement_id: m_2026_07_max_5x_model_haiku_4_5
    source_kind: per_model_breakdown
    model_id: claude-haiku-4-5
    window_5h_tokens: 900000000
    cost_per_million: 0.2000
    input_per_million: 1.00
    cached_per_million: 0.10
    output_per_million: 5.00
    credibility: medium
    notes: |
      Haiku 4.5 ($1/$0.10/$5):Pro 180M × 5 = **900M tokens/5h**。
