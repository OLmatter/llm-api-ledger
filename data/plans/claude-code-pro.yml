      Anthropic prompt cache 命中场景下 cache_read 占比与 OpenAI/Gemini 类似。
      用于 per-model 拆分反推 cost_per_million。
      注:Anthropic prompt cache 5min 写价 ×1.25(实测用户行为下大部分 cache 走 5min)。

