# Claude Code Pro Plan
# Claude Code 入门档 = 1× Claude Code 基准
# 2026-07-31 更新:
#   - 5h tokens: awesome-coding-plan 实测 39.66M(88% 吃满率)
#   - 5h 翻倍 2026-05-06 起永久(SpaceX Colossus 1 算力),实测已含
#   - 周 +50% 临时促销 2026-05-14 ~ 2026-07-19 已结束,weekly/monthly 已剥离
#   - cost_limit_usd 字段基于 Maciek plans.py 标 disputed(community local_estimate)
#   - Max 5×/20× 套餐数据未独立核实,本 yml 不写(铁律 18)

plan_id: claude-code-pro
vendor: anthropic
plan_name: Claude Code Pro
plan_tier: pro
status: active
last_verified: 2026-07-31

# Claude Code 倍率:Pro 1× 基准
codex_multiplier: 1

# 额外用量(usage credits):Anthropic 官方「撞 limit 后按 API 价继续跑」机制
# 标 true 是因为开启后实际用量可超过 tokens_measured,前端需明示
reset_card_available: true
reset_card_note: |
  Anthropic 提供 usage credits(额外用量):撞 limit 后按标准 API 价继续跑。
  开启后实际用量可超过下方 tokens_measured 基础 cap,直到月度账单封顶。
  以下 tokens_measured 是「标准情况」,未开启 usage credits。

pricing:
  currency: USD
  original_monthly: 20
  yearly_total: 200              # 年付 $200 一次性
  yearly_monthly_equivalent: 17  # 年付折月价(anthropic.com/pricing 2026-07-31 确认)
  yearly_note: Anthropic 提供年付选项($200 一次性 ≈ $17/月,比月付便宜 15%)
  auto_renew_default: true

# 限额：5h(实测) + 周 + 月(已剥离 2026-07-19 结束的 +50% 临时促销)
limits:
  window_5h:
    requests_official: null
    tokens_measured: 39660000        # 39.66M tokens(awesome-coding-plan 实测)
    tokens_official_claimed: null
    cost_limit_usd: 36.00            # 5h cost limit(5-6 翻倍永久后)
    cost_limit_disputed: true        # Maciek community local_estimate
    cost_limit_credibility: medium
    note: |
      39.66M tokens = awesome-coding-plan 主表 Claude Pro 行实测:
      「5h 359 请求 / 3966万 tokens / $31.84 价值 / 88% 吃满率」。
      5h 翻倍 2026-05-06 起永久(SpaceX Colossus 1 算力),实测已含。
      cost limit = $36/5h(基于 Maciek plans.py,标 disputed)。
      Anthropic 官方不公布 5h token 数字。
      注:标准情况,开启 usage credits 可绕过此 cap。
  window_weekly:
    requests_official: null
    tokens_measured: 264670000       # 264.67M(实测 397M ÷ 1.5,剥离 +50%)
    tokens_official_claimed: null
    cost_limit_usd: 240.00           # $36 × 6.67(Pro 5h/周 比例)
    cost_limit_disputed: true
    cost_limit_credibility: medium
    note: |
      397M 来自 awesome-coding-plan Pro 周实测(含 5-14 ~ 7-19 +50% 促销),
      剥离后 = 264.67M。
      Anthropic 官方不公开周 cap 数字。
      周 +50% 临时促销已 2026-07-19 结束,未再次延期。
  window_monthly:
    requests_official: null
    tokens_official_claimed: null
    tokens_measured: 1058700000      # 1058.67M(实测 1588M ÷ 1.5)
    cost_limit_usd: 960.00           # $240 × 4(Pro 周/月 比例)
    cost_limit_disputed: true
    cost_limit_credibility: medium
    note: |
      1588M 来自 awesome-coding-plan Pro 月实测(含 +50%),剥离后 = 1058.67M。
      Anthropic 官方不公开月 cap 数字。

ratio_note: |
  Pro ($20/月) = Claude Code 1× 基准。
  ⚠️ 以下 5h/周/月数字是**标准情况**(未开启 usage credits),开启后实际用量可超过此 cap。

  ## 实测基础(awesome-coding-plan 2026-Q2)
  - 5h: 359 请求 / 3966万 tokens / $31.84 / 88% 吃满率
  - effective $/M = 0.91(实测,反映 Opus+Sonnet+Haiku 混合 + 缓存命中)
  - 周/月比例 1 : 6.67 : 26.7(实测验证)

  ## 政策时间线
  - 2026-05-06:5h 限额永久翻倍(SpaceX Colossus 1 算力),实测已含
  - 2026-05-14:周 +50% 临时促销(对冲 Codex 拉新),本 yml weekly/monthly 已剥离
  - 2026-07-19:周 +50% 第二次延期到期,未再次延期,周/月回到基础 cap

  ## 主力模型(anthropic.com/pricing 2026-07-31)
  - **Opus 5**(2026-07-24):Claude Max 默认,Pro 可用,$5/$25
  - **Sonnet 5**(2026-06-30):Pro/Free 默认,$2/$10 限时到 2026-08-31,之后 $3/$15
  - **Fable 5**:Pro 仅走 usage credits(不占 $20 套餐额度)
  - Opus 4.8/4.7/4.6/4.5、Opus 4.1、Sonnet 4.6/4.5、Haiku 4.5 均可订阅使用

  ## ⚠️ Max 5× ($100) / Max 20× ($200) 套餐数据未独立核实,本 yml 不写
  anthropic.com/pricing FAQ 明示「5×/20× more usage per 5-hour session than Pro」,
  但 weekly/monthly caps 由 Anthropic 酌定,不保证按 5×/20× 等比缩放。
  等独立实测后再补 Max 5×/20× 套餐 yml。

measurements:
  # ── 1. 实测层：awesome-coding-plan 主表 Pro 行（最硬证据） ──
  - measurement_id: m_2026_07_awesome_coding_plan_pro_5h
    source_kind: community_consensus
    period: 2026-Q2
    user_hash: n/a
    window_5h_tokens: 39660000
    window_weekly_tokens: 397000000    # 含 +50%,已在 limits 字段剥离
    window_monthly_tokens: 1588000000  # 含 +50%,已在 limits 字段剥离
    requests_5h: 359
    effective_cost_per_million: 0.91
    consumption_rate_percent: 88
    credibility: high
    disputed: false
    notes: |
      awesome-coding-plan 主表 Claude Pro 行(Claude Opus 4.8,$20/mo):
      「5h 359 请求 / 3966万 tokens / $31.84 / 88% 吃满;w 3590/3.97亿;mo 14360/15.88亿」。
      Cross-validated:Maciek plans.py 同款 cost_limit $18/$35/$140(翻倍后 $36/$70/$280)。
      本 yml weekly/monthly 已剥离 2026-07-19 结束的 +50% 临时促销(÷1.5)。

  # ── 2. 政策层：5h 翻倍永久 ──
