    source_kind: anthropic_official
    period: 2026-05-06 ~
    cost_limit_5h_usd_before: 18.00
    cost_limit_5h_usd_after: 36.00
    credibility: high
    notes: |
      2026-05-06 Code with Claude SF 大会公告:
      5h 限额永久翻倍(SpaceX Colossus 1 算力合作,22万张 NVIDIA GPU)。
      Pro 翻倍前 $18/5h → 翻倍后 $36/5h。

