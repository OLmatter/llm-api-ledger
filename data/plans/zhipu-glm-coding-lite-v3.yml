plan_tier: lite
status: active
last_verified: 2026-07-31

pricing:
  currency: CNY
  original_monthly: 118           # 官方连续包月原价
  original_quarterly: 283.2       # 连续包季 8 折后总价 = 118 × 3 × 0.8
  original_yearly: 991.2          # 连续包年 7 折后总价 = 118 × 12 × 0.7
  yearly_monthly_equivalent: 82.6  # 年付折月价 = 991.2 ÷ 12
