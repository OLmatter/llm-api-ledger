  ## v2 → v3 价格差异
  | 字段 | v2 | v3 | 变化 |
  | --- | --- | --- | --- |
  | 月价 | ¥49 | ¥118 | **+141%** |
  | 季付折月 | ¥44.1 (9 折) | ¥94.4 (8 折) | +114% |
  | 年付折月 | ¥39.2 (8 折) | ¥94.4 (8 折) | +141% |
  | 季/年折扣率 | 9 折 / 8 折 | 8 折 / 8 折 | 折扣变紧 |

  注:v2 ¥49 可能是首月优惠价/历史快照/特殊渠道价。
  智谱官方 2026-02-12 公告「整体涨幅 30% 起」,但 v2→v3 实际涨幅 140%+,说明 v2 数字非标准连续包月原价。

  ## 用量单位说明
  官方用「积分/周」而非 tokens/周。1 积分 = 多少 tokens 官方未明确,
  v2 yml 反推 50M tokens/周 不一定准确。本 v3 yml 用 credits_weekly 字段,
  避免 tokens 字段被反推误导。

