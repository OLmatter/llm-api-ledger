  新用户只能购买 v3;v2 老用户可继续使用 v2(不强制迁移,自动续费已禁用)。

  v3 (2026-07-31 官方 Chrome dump-dom):
  - **Lite ¥118/月**(连续包月原价)
  - **¥283.2/季**(连续包季 8 折后总价)
  - **¥991.2/年**(连续包年 7 折后总价,折月 ¥82.6)
  - 套餐用量:**10,000 积分/周**(官方宣称,Pro 6×, Max 14×)
  - 模型池:GLM-5.2 / GLM-5-Turbo / GLM-4.7(1M 上下文)
  - 工具支持:Claude Code / Cline / OpenClaw / Cursor 等 20+
  - ZCode 0.67 折算权益(等效 1.5x 额度)

  ## ⚠ 数据状态
  - **宣称(claimed):** 官方「10,000 积分/周」(已填)
  - **实测(measured):** **无数据**(留 null,等用户实测后补)

