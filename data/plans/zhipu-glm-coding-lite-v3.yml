    requests_official: null
    credits_weekly: 10000          # 官方原话
  window_monthly:
    requests_official: null
    credits_monthly: 40000         # 10,000 积分/周 × 4 周 ≈ 40,000 积分/月
    monthly_estimated: true        # 官方按周披露,月是 4 周推算

ratio_note: |
  v3 (2026-07-31 官方 Chrome dump-dom):
  - **Lite ¥118/月**(连续包月原价)
  - **¥94.4/月**(连续包季 8 折 / 连续包年 8 折)
  - 套餐用量:**10,000 积分/周**(Pro 6×, Max 14×)
  - 模型池:GLM-5.2 / GLM-5-Turbo / GLM-4.7(1M 上下文)
  - 工具支持:Claude Code / Cline / OpenClaw / Cursor 等 20+
