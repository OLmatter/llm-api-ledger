    note: |
      官方页面原话:Lite「10,000 积分/周」(基础档,Pro 6×, Max 14×)。
      5h 窗口官方积分:2,000(Lite)/12,000(Pro)/28,000(Max)。
      周积分 = 5h × 5(官方固定倍数,动态刷新)。
      来源:docs.bigmodel.cn/cn/coding-plan/overview (2026-07-31 dump)
      注:积分 ≠ tokens,官方未公布 1 积分 = ? tokens 换算公式。
  window_weekly:
    requests_official: null
    tokens_measured: null
    tokens_scenario_estimate: 87000000     # 0.87亿/周 (全非高峰官方估算, GLM-5.2 @ 90.9% 缓存)
    credits_weekly: 10000          # 官方宣称:10,000 积分/周(同 5h 字段的官方数据)
  window_monthly:
    requests_official: null
    tokens_measured: null
    tokens_scenario_estimate: 348000000    # 0.87亿 × 4 (全非高峰 × 4 周)
    credits_monthly: 40000         # 10,000 积分/周 × 4 周(推算,标 estimated)
    credits_monthly_estimated: true
    monthly_estimated: true

