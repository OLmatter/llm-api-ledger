# 限额：v3 只有官方宣称,无实测
limits:
  window_5h:
    requests_official: null        # 官方未公布 5h 单独额度
    tokens_measured: null          # v3 无实测数据(等用户实测后补)
    tokens_official_claimed: null  # 官方未以 tokens 单位公布 5h cap
    credits_weekly: 10000          # 官方「10,000 积分/周」(Lite 基础周额度)
    note: |
      官方页面原话:Lite「10,000 积分/周」(基础档,Pro 6×, Max 14×)。
      注:积分 ≠ tokens,官方未公布 1 积分 = ? tokens 换算公式。
      本 v3 yml 只标「宣称」(claimed),实测 (measured) 字段留 null,
      等用户实测后补(铁律 18「零未授权修改」)。
      5h 滚动窗口额度未在页面明列。
  window_weekly:
    requests_official: null
    tokens_measured: null
    tokens_official_claimed: null
    credits_weekly: 10000          # 官方宣称:10,000 积分/周(同 5h 字段的官方数据)
  window_monthly:
    requests_official: null
    tokens_measured: null
    tokens_official_claimed: null
    credits_monthly: 40000         # 10,000 积分/周 × 4 周(推算,标 estimated)
    credits_monthly_estimated: true

