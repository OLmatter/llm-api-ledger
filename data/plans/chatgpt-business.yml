ratio_note: |
  Business ($25/user/month) = ChatGPT 团队订阅档,2+ 用户起。

  **价值定位**:面向中小企业团队,提供 admin console + SAML SSO + 数据隔离 + SOC 2 合规。

  **与 Plus 对比**:价格高 25% ($25 vs $20) 但获得企业管理能力。
  **与 Enterprise 对比**:便宜很多,Enterprise 提供 128K context + SCIM + Data analytics + API credits。

  包含 features:
  - SAML SSO + 统一账单 + 专属 workspace
  - GPTs analytics + 管理
  - Admin console + 批量成员管理 + 管理员角色
  - SOC 2 Type 2 合规
  - 基础用户分析
  - Domain verification
  - ISO 27001/27017/27018/27701 认证
  - SCIM(Enterprise only)
  - 数据不用于训练 (data excluded from training)

  **Nonprofits 75% 折扣**:OpenAI for Nonprofits 项目提供 Business/Enterprise 75% off。

