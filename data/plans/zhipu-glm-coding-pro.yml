# 智谱 GLM Coding Plan Pro
# 中档（基准 = Lite × 5 / Max ÷ 4）。
# 厂商级信息见 data/vendors/zhipu.yml。
# 基于 Max 普通客户端周实测 1B 反推。
# 2026-09 智谱停止 v2 新购入口,现有用户可继续续费;新用户走 v3 (zhipu-glm-coding-pro-v3)。

plan_id: zhipu-glm-coding-pro
vendor: zhipu
plan_name: GLM Coding Plan Pro (v2)
plan_tier: pro
status: active                  # 数据有效（仍可续费、套餐未下架）
discontinued_new_signup: true   # 2026-09 智谱停止 v2 新购入口,只允许现有用户续费
discontinued_note: |
  智谱已停止 GLM Coding Plan v2 新购入口。
  现有订阅不受影响,可正常续费 + 保留对应额度配额;
  新用户入口走 v3 (zhipu-glm-coding-pro-v3)。
  数据本身仍有效,作为续费档保留供老用户参考。
# 用量口径备注(统一 annotations 语法):探针实测反推(普通客户端 100% 口径),非官方「全非高峰」场景估算,与 v3 不可直接对比
usage_annotations:
  - kind: scenario
    value: probe_inferred
last_verified: 2026-07-22

pricing:
  currency: CNY
  original_monthly: 149
  original_quarterly: 402.3       # 包季 9 折
  original_yearly: 1430.4         # 包年 8 折
  auto_renew_default: true

limits:
  window_5h:
    requests_official: 400
    tokens_measured: 50000000       # 50M = Max 5h / 4
  window_weekly:
    requests_official: 2000
    tokens_measured: 250000000      # 250M = Max 周 / 4
  window_monthly:
    requests_official: null
    tokens_measured: 1075000000     # 1.075B = Max 月 / 4
    monthly_estimated: true

monthly_cap_note: |
  智谱官方只有 5h + 周两级限额，无月度硬封顶。
  月度 = 周额度 × 4.3 预估。

measurements: []
