ratio_note: |
  Official baseline:
  - Cursor Pro standard monthly price: $20.
  - Other Models pool: at least $20/month according to Cursor documentation.
  - Cursor Models pool: Grok 4.5 + Composer 2.5; exact dollar cap is not officially published.

  Single-user report for 2026-06-30 through 2026-07-30:
  - Dashboard: 562M total tokens, $341.73 included spend-equivalent, $0 on-demand.
  - Clean subscription-included CSV: 561,145,630 tokens across 631 rows.
  - Excluded from the clean total: 388,818 User API Key tokens, 886,583 free tokens,
    and three errored/no-charge rows with no token count.
  - Cursor Models rows: 512,424,585 tokens; Other Models rows: 48,721,045 tokens.

  The contributor observed only a low-single-digit percentage remaining in the Cursor Models pool
  and inferred roughly $300 of Cursor Models capacity. The exact remaining percentage is not present
  in the submitted screenshots, so the $300 figure and all derived model-equivalent token caps are
  disputed single-sample estimates, not official claims.

