# MiniMax Token Plan Plus
# 入门档（= 1× 基准）。
# 厂商级信息见 data/vendors/minimax.yml。
# 无独立实测，按官方倍率 Max/3 反推。

plan_id: minimax-tp-plus
vendor: minimax
plan_name: Token Plan Plus
plan_tier: plus
status: active
last_verified: 2026-07-21

pricing:
  currency: CNY
  original_monthly: 49
  original_yearly: 490           # 年付真实价（永久，非限时特惠）。月付×12=¥588 只是反推原价，不是真实年付价。
  auto_renew_default: false

# 限额：5h + 周（无月度）
# 周 = 10 × 5h；Plus = Max / 3
limits:
  window_5h:
    requests_official: null
    tokens_measured: null       # 按 Max 5h / 3 反推
  window_weekly:
    requests_official: null
    tokens_measured: null       # 按 Max 周 / 3 反推
  window_monthly:
    requests_official: null
    # tokens_official_claimed: 0.6B (6 亿 M3 token) 官方月度 published cap
    # build 不会把此值作 fallback 显示成"实测"
    # 但此字段保留在 yml 给 "claimed" 列输出 (0.6B) + ratio_note 文档参考
    tokens_official_claimed: 600000000
    tokens_measured: null

ratio_note: |
  MiniMax Token Plan：5h + 周 + 月三级限额（同火山/智谱，独立判断同时生效）。
  Plus = Max / 3。
  Plus 5h = 145M / 3 ≈ 48.3M，周 = 1.45B / 3 ≈ 483M，月 = 0.6B（官方）。

measurements: []

features:
  video_daily_quota: 0     # Plus 无视频额度
  concurrent_agents: "3-4"
