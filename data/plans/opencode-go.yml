# OpenCode Go
# 2026-08-14 抓取 https://opencode.ai/docs/zh-cn/go/ (Chrome headless dump-dom)
# 主套餐价格未变:首月 $5,之后 $10/月;5h $12 / 周 $30 / 月 $60
# 主字段口径 2026-08-14 从 GLM-5.2 改为 GLM-5.3（用户原话: "opencode 的 5.2 改为使用 5.3 模型"）
#   - 单价 + tokens/请求 与 GLM-5.2 完全相同（$1.40/$4.40/$0.26, 700+52000+150）
#   - 但月档从 $60 降到 $15（opencode "略高于直接付费"档,不走 6× 乘数）
#   - 因此 5h/周/月 请求数从 880/2150/4300 → 220/540/1080（1/4）
# DeepSeek V4 Flash: measurement 加 _offpeak 单价（2026-08-14 DS 官方分峰/非峰）

plan_id: opencode-go
vendor: opencode
plan_name: OpenCode Go
plan_tier: go
status: active
last_verified: 2026-08-14

# Go 只有单一档位,自身即 1× 基准(无同厂商其他档可比)
