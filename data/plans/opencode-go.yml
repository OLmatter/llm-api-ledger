      来源:https://opencode.ai/docs/zh-cn/go/ (Chrome headless --dump-dom 抓取)
      原文:「OpenCode Go 是一项低成本的订阅服务 —— 首月 5 美元,之后每月 10 美元」
      「5 小时限制 — 12 美元使用额度 / 每周限制 — 30 美元使用额度 / 每月限制 — 60 美元使用额度」
      「限制以美元价值定义。这意味着你的实际请求数取决于你所使用的模型。」

  # ── 2. GLM-5.3 口径(2026-08-14 改: 榜单主字段从 GLM-5.2 改用 GLM-5.3) ──
  - measurement_id: m_2026_08_opencode_go_glm_5_3
    source_kind: per_model_breakdown
    period: 2026-08-14
    model_id: glm-5.3
    scope: opencode-go-client    # OpenCode Go 客户端在自家使用模式下的观察值，非 API 通用值
    requests_5h: 220
    requests_weekly: 540
    requests_monthly: 1080
    tokens_per_request: 52850          # 700 输入 + 52,000 缓存 + 150 输出（与 GLM-5.2 完全相同）
    window_5h_tokens: 11627000
    window_weekly_tokens: 28539000
    window_monthly_tokens: 57078000
    input_per_million: 1.40
    output_per_million: 4.40
    cached_per_million: 0.26
    cost_per_request: 0.01516
    cost_per_million: 0.2868           # $0.01516 ÷ 52,850 tokens × 1e6
    model_monthly_credit_usd: 15       # 2026-08-14 GLM-5.3 在 Go 是 $15 档（原 GLM-5.2 是 $60 档）
    credibility: medium
    disputed: false
    notes: |
      请求数与 token 组成均为官方公布(https://opencode.ai/docs/zh-cn/go/, 2026-08-14 抓取)。
      官方 token 组成原文:「GLM-5.3/5.2/5.1 — 每次请求 700 个输入 token,52,000 个缓存 token,150 个输出 token」。
      GLM-5.3 是 z.ai 官方 docs 新增模型（标"New"）,单价 + tokens 跟 GLM-5.2 完全相同,
      但 opencode 给 GLM-5.3 走 $15 档（不是 $60 档）,即"略高于直接付费"档（不走 6× 乘数）。
      因此 5h/周/月 请求数 = GLM-5.2 的 1/4 = 220/540/1080。

      ⚠ 自洽性验算（同 GLM-5.2 一样 8.6% 缺口,如实记录）:
      每请求成本 = (700×$1.40 + 52,000×$0.26 + 150×$4.40) / 1e6 = $0.01516
      按此反推 $15 月额度 = 989 请求,但官方标 1,080(高 9.2%);
      $12/5h 反推 = 792 请求,官方标 220(低 72%, 因 $15 档不是 $60 档,不在同一基准)。
      推断:GLM-5.3 在 Go 走的是厂商标价(无额外批量折扣),官方请求数为实际观察值取整。
      榜单采用官方公布的请求数,不用反推值覆盖。

      单价交叉验证:z.ai 官方 docs(docs.z.ai/guides/overview/pricing, 2026-08-14 抓取)
      GLM-5.3 标"New"未单独列价,但 GLM-5.2 = Input $1.4 / Cached Input $0.26 / Output $4.4
      与 Go 完全一致,零加价属实。

