ratio_note: |
  ## 这是什么
  OpenCode Go 是 opencode(SST/Anomaly)出的**低成本开源模型订阅**,与按量充值的 OpenCode Zen 是两个产品。
  订阅后拿到 API key,以 provider 形式接入 opencode TUI 或任意 Agent。

  ## 定价与额度
  - 首月 **$5**,之后 **$10/月**
  - 额度以**美元价值**定义:5h **$12** / 周 **$30** / 月 **$60**
  - 官方自述:「你每月支付 $10,我们的目标是为你提供 6 倍于此的使用额度」,靠批量折扣 + 预留 GPU 容量实现

  ## ⚠ 6× 乘数不是全模型统一
  月额度 **$60** 档:GLM-5.2 / GLM-5.1 / Kimi K2.7 Code / Kimi K2.6 / MiniMax M3 / M2.7 / M2.5 /
  Qwen3.7 Plus / Qwen3.6 Plus / Qwen3.7 Max / MiMo-V2.5 / DeepSeek V4 Flash / Hy3
  月额度 **$15** 档:GLM-5.3 / Grok 4.5 / GPT 5.6 Luna / Kimi K3 / DeepSeek V4 Pro / MiMo-V2.5-Pro
  官方解释:这些模型尚未谈下批量折扣,或其公开价已经是折扣价。

  ## 零加价已验证(2026-08-14, GLM-5.3 + GLM-5.2 + DS V4 Flash)
  | 模型 | Go 输入/输出/缓存($/M) | 厂商官方 | 来源 |
  |---|---|---|---|
  | GLM-5.3 | 1.40 / 4.40 / 0.26 | 1.4 / 4.4 / 0.26 | docs.z.ai/guides/overview/pricing (Go 列"New") |
  | GLM-5.2 | 1.40 / 4.40 / 0.26 | 1.4 / 4.4 / 0.26 | docs.z.ai/guides/overview/pricing |
  | DeepSeek V4 Flash (Off-Peak) | 0.22 / 0.66 / 0.007 | 0.22 / 0.66 / 0.007 | api-docs.deepseek.com/quick_start/pricing (2026-08-14 新增分峰/非峰) |
  | DeepSeek V4 Flash (Peak) | 0.44 / 1.32 / 0.014 | 0.44 / 1.32 / 0.014 | api-docs.deepseek.com/quick_start/pricing (2026-08-28 直抓全表,峰=谷×2) |
  | DeepSeek V4 Pro (Off-Peak) | 0.66 / 1.98 / 0.022 | 0.66 / 1.98 / 0.022 | 同上 (V4-Pro 正式版 2026-08-13 上线,$15 档可用) |
  | DeepSeek V4 Pro (Peak) | 1.32 / 3.96 / 0.044 | 1.32 / 3.96 / 0.044 | 同上 |
  Go 不在单价上加价,价值来自分档额度乘数(部分模型 6×,部分模型<6×)。
  ⚠ DS 峰谷规则(2026-08-17 生效):高峰=北京时间工作日 9-12/14-18 点,价格=谷×2;
  周末全天谷价(2026-08-23 起)。谷价跑量成本不变,工作日白天跑量成本×2。
  全表见 data/deepseek/official/2026-08-28_ds_peak_valley_pricing.md(2026-08-28 官方直抓)。
  ⚠ 币种/版本归属(2026-08-28 澄清):上表 DS 两行是 **DS 国际版美元价**
  (api-docs.deepseek.com EN 站),opencode 零加价直通(与 opencode 费率卡逐项一致)。
  DS 国内版为人民币价且数字不同:谷 未命中 ¥1.5 / 输出 ¥4.5 / 命中 ¥0.05(峰×2),
  别把国内 CNY 价和国际 USD 价混在一张表里比。

  ## 选模型决定能跑多少(差 47 倍)
  按各模型**实际月档**算（不同模型月档不同）:
  - GLM-5.2(月档 $60) → 4,300 请求 / 2.27 亿 tokens
  - GLM-5.3(月档 $15) → 1,080 请求 / 0.57 亿 tokens
  - DeepSeek V4 Flash(月档 $30,2026-08-17 调价后) → 谷价 35,943 请求 / 24.8 亿 tokens(峰价减半)
  榜单主字段取 GLM-5.3 口径(2026-08-14 最新模型,便于与智谱/z.ai 横比),不代表 Go 的上限。

  ## ⚠ 为什么 GLM-5.3 看起来比 GLM-5.2「贵 4 倍」
  同样 $10 月费：GLM-5.2 走 $60 档(6× 乘数,月跑 4,300 请求),GLM-5.3 走 $15 档(1.5× 乘数,月跑 1,080 请求)。
  → 单价没变,但**每个请求有效成本 GLM-5.3 = $0.00926 / 请求**vs GLM-5.2 = $0.00233 / 请求(4×)。
  → 这不是 bug,是 opencode 官方定价决定:GLM-5.3 是「New」模型,opencode 还没谈下批量折扣(跟 DS V4 Flash / Pro / Kimi K3 一档)。
  → 用户看到的「缩水 4 倍」是 opencode 真实定价,不是榜单数据错误。

  ## 撞限之后
  - 仍可继续使用免费模型
  - 若 Zen 账户有余额,可在控制台开启「Use balance」,撞限后回退用 Zen 余额继续跑(不拦截请求)

  ## 限制
  每个工作空间只能有一名成员订阅 Go。官方注明使用限制可能随早期反馈调整。

measurements:
  # ── 1. 官方定价与额度(一手) ──
  - measurement_id: m_2026_07_opencode_go_official_pricing
    source_kind: vendor_official
    source_url: https://opencode.ai/docs/zh-cn/go/
    evidence_path: data/opencode/official/2026-07-31_opencode_go_official.md
    captured_at: 2026-07-31
    period: 2026-07-31
    pricing_first_month_usd: 5
    pricing_monthly_usd: 10
    cost_limit_5h_usd: 12
    cost_limit_weekly_usd: 30
    cost_limit_monthly_usd: 60
    credibility: high
    disputed: false
