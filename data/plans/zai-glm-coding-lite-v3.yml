        跟按量 API 促销价**不**互通——这是两套体系。yml 用 Coding Plan 积分反推值(套餐口径)。

      ⚠ 编程场景 cache 命中率 90.9% + token 比例 4.4/90.9/0.6 是从用户 MiniMax 实测 + 智谱官方缓存命中数据综合推断,
        高峰期混合跑会落到下限,反推值是**全非高峰 + 90.9% cache 命中**理论上限。
