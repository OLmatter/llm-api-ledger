ratio_note: |
  Go ($8/月) = ChatGPT 廉价订阅档,2025-08 在印度首发 (₹399 ≈ $8 USD),2026 全球化推广。

  **价值定位**:介于 Free (0) 和 Plus ($20) 之间,适合需要"更多对话额度但用不起 Plus"的用户。

  包含广告 (ChatGPT 首个含广告付费档)。

  等效周 API 算力估算 ≈ $20-30/周(基于 Plus $100-120/周 × 0.2-0.25 ratio)

