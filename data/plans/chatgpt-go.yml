# ChatGPT Go Plan（ChatGPT 廉价订阅档，介于 Free 与 Plus 之间）
# 2026-07-31:基于 chatgpt.com/pricing 页面 (Playwright stealth 抓取) + 腾讯新闻 "OpenAI 全面上线廉价版 ChatGPT Go 订阅方案:每月 8 美元"

plan_id: chatgpt-go
vendor: openai
plan_name: ChatGPT Go
plan_tier: go
status: active
last_verified: 2026-07-31

# tier_multiplier:Go 是 Plus 之下的廉价档,估算约 0.4×(基于价格比 8/20)
# 注意:这是估算值,OpenAI 官方不公布绝对倍数,仅以价格比反推
tier_multiplier: 0.4

pricing:
  currency: USD
  original_monthly: 8
  yearly_total: null
  yearly_monthly_equivalent: null
  yearly_note: OpenAI 不提供 Go 年付选项
  auto_renew_default: true

# Codex 配额倍率:Go 在 Free 和 Plus 之间,具体倍率未官方公布
# Go 相比 Free 的差异是 "More access/messages/uploads/images/longer memory"
codex_multiplier: 0.4           # 估算约为 Plus 1× 的 30-50%(待实测)

# Go 包含广告 (per chatgpt.com/pricing 页面文案 "This plan may include ads")
ads_included: true
ads_note: |
  chatgpt.com/pricing 页面明确标注 "This plan may include ads. Learn more"
  Go 是 ChatGPT 首个包含广告的付费档位。

