      "每 5 小时 6,000 次请求。滚动恢复，每分钟自动释放 5 小时前的额度。"
      单位是"模型调用次数"，不是 tokens（铁律 4 / 铁律 20）。
  window_weekly:
    requests_official: 45000       # 周一 00:00 UTC+8 重置
    tokens_measured: null
    tokens_official_claimed: null
    note: |
      来源：help.aliyun.com/zh/model-studio/coding-plan
      "每周 45,000 次请求。每周一 00:00:00 (UTC+8) 重置。"
  window_monthly:
    requests_official: 90000       # 订阅日次月对应日 00:00 UTC+8 重置
    tokens_measured: null
    tokens_official_claimed: null
    note: |
      来源：help.aliyun.com/zh/model-studio/coding-plan
      "每月 90,000 次请求。在下一个月订阅日的 00:00:00 (UTC+8) 重置。"
      月 = 周 × 2（铁律 6 通过，与火山方舟同型硬封顶）。
      用户控制台实测 2026-08-04：订购时长 1 个月，自动续费至 2026-09-01。

# 铁律 4 / 铁律 20：单位是"模型调用次数"，不是 tokens
claimed_unit: "次"

# 铁律 28：availability 是决定性约束（能否订阅），不能藏在 risk_flags 数组里
availability:
  status: limited_quota
  restock_schedule: "每日 09:30 UTC+8"
  restock_method: "先到先得"
  fail_open_behavior: "售罄即不可订阅（fail-closed）"
  last_verified: 2026-08-04
  source: "data/alibaba/official/2026-08-04_user_console_screenshot.png"

risk_flags:
  - 严禁 API 调用（仅限交互式编程工具，违规封号）
  - 不支持退款
  - 禁止账号共享（检测到 Key 公开泄露自动禁用）
  - 数据用于模型训练与优化
  - 不可降配（Pro → Lite）
  - 单一订阅（每账号只能持有 1 个 Coding Plan）
  - API Key 专属：sk-sp-xxxxx，Base URL 必须含 coding.dashscope.aliyuncs.com（误用通用 Key/URL 走按量计费）
  - 服务周期按自然月（2 月开通可能只有 28 天）

ratio_note: |
  ## 限量抢购细节（控制台实测 2026-08-04）
  - 每日 09:30（UTC+8）限量补货
  - 售完即不可订阅（fail-closed，无降级到 waitlist）
  - 抢购页面：https://www.aliyun.com/benefit/scene/codingplan

  ## 单位口径（铁律 4 / 铁律 20）
  - 套餐按"模型调用次数"扣费，不是 tokens
  - 简单任务约消耗 5-10 次，复杂任务约 10-30+ 次
  - 官方明示"额度消耗与 Token 消耗无关"且"暂无法查看 Token 消耗"

  ## 数据状态
  - 实测（measured）：无数据（无探针运行）
  - 宣称（claimed）：6,000/45,000/90,000 次/月 — 铁律 9 留 null

