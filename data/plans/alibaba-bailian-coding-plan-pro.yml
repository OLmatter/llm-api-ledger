  # 来源：用户控制台购买页实测 2026-08-04 显示"新手优惠 30 天 6.25 折"
  # 注意：官方帮助文档 2026-07-16 写"限时优惠已结束"，文档与控制台存在时差
  # → 以控制台实测为准（用户实际下单界面是最权威的实时数据）
  intro_monthly: 125               # 200 × 0.625（30 天 6.25 折）
  intro_duration_months: 1         # 30 天首购
  intro_condition: "新用户首购（每个百炼账号仅可享受一次）"
  intro_end_hint: null             # 官方未公布活动截止日；30 天后自动恢复 ¥200
  intro_tag: "首月 6.25 折"         # 显式覆盖默认"用邀请码"标签（用户原话：优惠 ≠ 邀请码）
  intro_source: "data/alibaba/official/2026-08-04_user_console_screenshot.png"
  intro_source_url: "https://bailian.console.aliyun.com/cn-beijing/?tab=plan#/efm/subscription/coding-plan"
  # ── 优惠多阶段结构（用户 2026-08-04：优惠生命周期是「首月 + 首次续费」2 阶段）──
  # 不是「首月特价 → 恢复原价」的折扣过渡，而是订阅生命周期的两个阶段
  intro_stages:
    - stage: 1
      name: "首月（新用户首购）"
      duration_months: 1
      price: 125                    # ¥200 × 0.625
      discount_rate: 0.625
      condition: "新用户首购（每个百炼账号仅可享受一次，30 天）"
      source: "data/alibaba/official/2026-08-04_user_console_screenshot.png"
    - stage: 2
      name: "首次续费（5 折历史活动已结束）"
      duration_months: null          # 续费周期
      price: 200                    # 当前续费 = ¥200（5 折活动已结束于 2026-04-01）
      discount_rate: null
      condition: "首次续费；历史曾有 5 折活动已于 2026-04-01 结束，当前无续费优惠"
      source: "data/alibaba/official/2026-08-04_bailian_coding_plan_official.md (FAQ)"
      historical_note: |
        ⚠ 历史活动（已结束）：FAQ 写"首次续费 5 折活动已于 2026-04-01 结束"。
        控制台 2026-08-04 未显示续费优惠 → 当前续费恢复 ¥200 原价。
        若官方另发续费活动，会再加 stage 3。
  intro_discount_note: |
    ⚠ 来源差异：
    - 用户控制台实测 2026-08-04 显示"新手优惠 30 天 6.25 折"（用户亲口确认）
    - 官方帮助文档 2026-07-16 写"限时优惠活动已结束"
    - 官方帮助文档 FAQ 写"**首次续费 5 折活动已于 2026-04-01 结束**"
    → 当前以控制台为准写入；官方文档可能未同步最新活动
    → 优惠生命周期 2 阶段：
        1. **首月**（新用户首购）：6.25 折 ¥125，30 天
        2. **首次续费**：5 折历史活动已结束，当前续费 = ¥200 原价
  auto_renew_default: true
  price_warning: |
    不支持退款、不支持降配；数据用于模型训练与优化。
    新用户可享 30 天 6.25 折首购（¥125），30 天后自动恢复 ¥200/月。

limits:
