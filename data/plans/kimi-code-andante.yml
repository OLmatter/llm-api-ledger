plan_id: kimi-code-andante
vendor: kimi
plan_name: Code Plan Andante
plan_tier: andante
status: active
last_verified: 2026-09-08
# 本档不支持 K3(官方:仅 Moderato 及以上可用),CLI 编程模型为 K2.7 Code
primary_model: K2.7 Code

# 口径标注:月用量为官方倍率反推,非本档独立实测
usage_annotations:
  - kind: scenario
    value: official_multiplier

pricing:
  currency: CNY
  original_monthly: 49
  yearly_total: 468
  yearly_monthly_equivalent: 39
  yearly_note: 年付 468 元，折合 39 元/月（预付优惠）
  auto_renew_default: false

# 限额：5h + 周 + 月
limits:
  window_5h:
    requests_official: null
    tokens_measured: null                  # 5h cap 存在但用户未实测
  window_weekly:
    requests_official: null
    tokens_official_claimed: null
    tokens_measured: null                  # 本档未实测;构建脚本按 Allegretto 周实测 × 1/20 反推展示
  window_monthly:
    requests_official: null
    tokens_official_claimed: null
    tokens_measured: 50000000              # 官方倍率链:Allegretto 月 10亿(@Golden白 明说) × 1/20 = 50M
    monthly_estimated: true                # 倍率反推,非本档独立实测
    is_unlimited: false

ratio_note: |
  Andante (1×) 三层限额:
  - 5h cap: 未测(@COTTIWWWW 没测 5h)
  - 7 天 cap: 本档未实测,按 Allegretto 周实测 508M × 1/20 = 25.4M 反推展示
  - 月 cap: 按官方倍率链 50M(Allegretto 10亿 × 1/20),monthly_estimated=true,标注「官方倍率反推」
  倍率:Andante=1×,Moderato=4×,Allegretto=20×,Allegro=60×(Kimi 官方口径,用户确认可信)
  数据状态:5h/周无独立实测;月为官方倍率反推(带口径标注,区别于 Allegretto/Allegro 的用户实测)

measurements:
