    source_kind: vendor_official
    source_url: https://www.kimi.com/code
    evidence_path: data/kimi/official/2026-08-28_kimi_k3_launch.md
    captured_at: 2026-08-28
    credibility: high
    notes: |
      K3(2026-07-17 发布,1M 上下文)正式上线;Code Plan 仅 Moderato 及以上可用 K3,本档不支持 K3。
      CLI 编程模型为 K2.7 Code;平台迁移 platform.moonshot.cn → platform.kimi.com(301)。
      四档价格复核一致(49/99/199/699);第三方称存在第5档+限购,存疑未证实(见 evidence)。
      Moonshot V1 2026-08-31 全平台下线。