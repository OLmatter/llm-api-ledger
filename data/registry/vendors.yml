inclusion_rules:
  data_completeness:
    - 月费 / 首购价 / 续费价至少 2 项已知
    - 月限额 / 5h / 周限额至少 1 项已知（铁律 16）
    - 单位明确（tokens / 次 / Credits / USD）
    - 模型清单已知
  evidence:
    - 官方订阅页或价格页（公开）
    - 用户控制台截图（订阅型）
    - 官方 API pricing 文档（API 型）
  validation:
    - 铁律 16：不编造官方未公布数据
    - 铁律 22：自洽性验算（Token Plan 类必须）
    - 铁律 28：availability 字段必填
  dedup:
    - 与已有厂商不重复（如 deepseek_cn vs deepseek_intl 必须区分）
    - 火山方舟 vs 字节豆包是同源不同账户，需明确归属

