# LLM API 厂商注册表 v2（2026-08-04 整理）
# 用途：
#   - 记录所有已知 LLM API 厂商（含追踪、未追踪）
#   - 后续榜单收录（挪到 data/vendors/ + data/plans/）从此表挑
#   - 提供处理友好的元数据（slug、source、priority、collection_difficulty）

# ──────────────────────────────────────────────────────
# 数据源
# ──────────────────────────────────────────────────────
sources:
  - id: berriai_litellm
    name: BerriAI/litellm model_prices_and_context_window.json
    url: https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json
    models_count: 2986
    captured_at: 2026-08-04
    coverage: 全模型按 token 单价；按 brand 识别厂商

  - id: simonw_llm_prices
    name: simonw/llm-prices
    url: https://github.com/simonw/llm-prices
    coverage: LLM token 价格追踪（HTML）

  - id: wmpeng_codingplan
    name: wmpeng/codingplan + codingplan.fyi
    url: https://github.com/wmpeng/codingplan
    coverage: 国内 31 平台为主，含 Cursor / Claude / Gemini / Mistral / Perplexity 海外订阅

  - id: cloud_vendor_official
    name: 厂商官网 / 控制台实测
    coverage: 用户控制台截图、官方订阅页、价格 API

# ──────────────────────────────────────────────────────
# 字段说明
# ──────────────────────────────────────────────────────
# vendor_id        : 全局唯一 slug（小写，无空格），用于文件名和跨表 join
# name             : 英文显示名
# name_zh          : 中文显示名（可选）
# region           : us / eu / cn / cn_global / jp / kr / global（多区域）
# service_type     : subscription_api / coding_plan / api_provider / aggregator / gpu_cloud
# has_subscription : bool，是否有月度订阅档
# has_coding_plan  : bool，是否有"Coding Plan / Token Plan"型订阅
# known_subscriptions : 已知订阅档（含价格）
# known_models     : 主要模型家族
# status           : tracked（已收录）/ candidate（待收录）/ archive（已归档）/ skip（明确跳过）
# priority         : high / medium / low（收录优先级）
# data_source      : 已收录厂商指向 data/vendors/<id>.yml
# discovered_from  : 从哪些 source 发现此厂商
# discovered_at    : 首次入库日期
# collection_difficulty : easy（公开数据足够）/ medium（需要控制台）/ hard（需用户主动提供）
# evidence_required : 收录此厂商需要的证据类型
# parent_vendor    : 子厂商的母公司（如 aws_bedrock.parent=aws）
# blocked_reasons  : 明确跳过的原因（如合规、闭源、仅企业内购）
# notes            : 自由备注

