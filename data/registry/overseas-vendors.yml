# 海外 LLM API 厂商注册表（2026-08-04 调研）
# 用途：存数据库备用，不上榜。后续如要收录，挪到 data/vendors/ + data/plans/
# 来源：
# - BerriAI/litellm model_prices_and_context_window.json（2986 个模型条目，按 brand 统计）
# - simonw/llm-prices（LLM token 价格追踪）
# - wmpeng/codingplan + codingplan.fyi（国内为主，含少数海外订阅）
# - 厂商官网公开订阅页

overseas_vendors:
