# ── 调研来源 ──
sources:
  - name: BerriAI/litellm model_prices
    url: https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json
    models_count: 2986
    captured_at: 2026-08-04
    notes: |
      按 brand prefix 统计的模型数：
      gpt 464 / fireworks 251 / mistral 189 / deepseek 157 /
      claude 151 / gemini 151 / bedrock 132 / meta 99 /
      novita 68 / grok 64 / deepinfra 45 / cohere 43 /
      openrouter 38 / together 34 / perplexity 31 /
      groq 11 / cerebras 6 / codestral 5
  - name: simonw/llm-prices
    url: https://github.com/simonw/llm-prices
    notes: LLM token 价格追踪（HTML index，无 JSON 暴露）
  - name: wmpeng/codingplan + codingplan.fyi
    url: https://github.com/wmpeng/codingplan
    notes: |
      国内为主（含 31 个平台），含海外：Cursor / Claude Pro / GitHub Copilot
      / Gemini / Mistral / Perplexity 等

# ── 收录计划 ──
inclusion_plan:
  priority_high:
    - cursor        # 编程编辑器订阅代表
    - openrouter    # LLM API 中转站之首
    - perplexity    # 搜索增强 AI 订阅
    - deepseek_intl # 海外版 DeepSeek
  priority_medium:
    - xai
    - groq
    - together
    - github_copilot
    - mistral
  priority_low:
    - aws_bedrock
    - azure_openai
    - cohere
    - fireworks
    - replicate
    - lambda_labs
    - cerebras
    - anyscale
    - meta_llama
    - nvidia_nim
    - yi_01ai
    - writer
    - google
    - deepinfra
    - novita
  criteria_for_inclusion:
    - 用户控制台截图（订阅型）或官方 API pricing 页（API 型）
    - 价格数据完整（至少月费 / 限额 / 单位）
    - 不与已有国内厂商重复（如 deepseek_intl vs 国内 DeepSeek）
    - 通过铁律 16/22/28 验证