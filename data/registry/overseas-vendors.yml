    name: OpenAI
    region: us
    service_type: subscription_api
    known_subscriptions:
      - ChatGPT Plus ($20/月)
      - ChatGPT Pro ($200/月)
      - ChatGPT Business
      - ChatGPT Enterprise
      - ChatGPT Team
    status: tracked
    data_source: data/vendors/openai.yml
    notes: 6 档已收录（chatgpt-go / plus / pro-5x / pro-20x / business / enterprise / claude-code-pro）

  - vendor_id: anthropic
    name: Anthropic
    region: us
    service_type: subscription_api
    known_subscriptions:
      - Claude Pro ($20/月)
